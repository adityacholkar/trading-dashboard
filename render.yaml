# Render blueprint: one web service serving the API, the WebSocket relay,
# and the built React app from a single URL (see README "Main decisions").
services:
  - type: web
    name: trading-dashboard
    runtime: node
    plan: free
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
